defaults:
  - default

# CCF-only ablation: no consistency losses, no energy match, no mask.
# Goal: isolate whether cross-channel fusion alone helps vs old_arch baseline.
lambda_mel_consist: 0.0
lambda_energy:      0.0
lambda_mask:        0.0
mrstft_short_window: true

epochs: 60
lr:     6.0e-4

ckpt_dir: "checkpoints/audiolaser"
resume_path: null

wandb_run_name: "audiolaser"
